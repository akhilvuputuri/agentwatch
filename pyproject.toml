[project]
name = "agentwatch"
version = "0.1.0.dev0"
description = "Local tracing, monitoring and evaluation for LLM agents, built on OpenTelemetry GenAI traces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akhil Vuputuri", email = "akhilvuputuri@gmail.com" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=2.0.0",
    "opentelemetry-proto>=1.45.1",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
agentwatch = "agentwatch.cli:main"

[project.urls]
Repository = "https://github.com/akhilvuputuri/agentwatch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The UI is built into src/agentwatch/static before packaging; it is not committed.
artifacts = ["src/agentwatch/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentwatch"]

[tool.hatch.build.targets.sdist]
exclude = ["ui/node_modules", "ui/dist", ".venv"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.13",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]
# The formatter owns line length; long SQL lines are left as written.
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
