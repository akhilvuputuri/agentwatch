name: image

# Builds the server image on every pull request and smoke-tests it; on main, also publishes
# it to GHCR (ghcr.io/akhilvuputuri/agentwatch), tagged with the commit and `main`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: agentwatch:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name aw -p 127.0.0.1:4318:4318 agentwatch:test serve --host 0.0.0.0 --retain-days 90
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4318/healthz && break; sleep 1; done
          trace=$(python3 -c "import secrets;print(secrets.token_hex(16))")
          now=$(python3 -c "import time;print(time.time_ns())")
          curl -sf -X POST http://127.0.0.1:4318/v1/traces -H 'content-type: application/json' \
            -d "{\"resourceSpans\":[{\"resource\":{\"attributes\":[]},\"scopeSpans\":[{\"spans\":[{\"traceId\":\"$trace\",\"spanId\":\"00000000000000a1\",\"name\":\"smoke\",\"kind\":1,\"startTimeUnixNano\":\"$now\",\"endTimeUnixNano\":\"$now\"}]}]}]}"
          curl -sf "http://127.0.0.1:4318/api/traces/$trace" | grep -q smoke
          curl -sf http://127.0.0.1:4318/ | grep -q '<div id="root">'
          test "$(docker exec aw id -u)" = 10001
          docker restart aw >/dev/null
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4318/healthz && break; sleep 1; done
          curl -sf "http://127.0.0.1:4318/api/traces/$trace" | grep -q smoke
          docker logs aw
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        id: push
        name: Publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ghcr.io/akhilvuputuri/agentwatch:sha-${{ github.sha }}
            ghcr.io/akhilvuputuri/agentwatch:main
          cache-from: type=gha
      - if: github.event_name != 'pull_request'
        run: echo "Published ghcr.io/akhilvuputuri/agentwatch@${{ steps.push.outputs.digest }} (sha-${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
